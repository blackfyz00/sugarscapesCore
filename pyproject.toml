[project]
name = "civ"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Заславский Ярослав", email = "blackfyz@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]

[project.scripts]
civ = "civ:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
